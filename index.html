<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cash Budget - Minimalist</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">

    <div class="max-w-md mx-auto px-6 py-8">
        <!-- Header -->
        <div class="flex justify-between items-center mb-10">
            <div>
                <p class="text-xs text-slate-400 font-medium">Selamat Datang</p>
                <h1 class="text-xl font-bold tracking-tight">Cash Budget</h1>
            </div>
            <select id="month-selector" class="bg-white text-xs font-semibold py-2 px-3 rounded-full shadow-sm border-none focus:ring-0"></select>
        </div>

        <!-- Saldo Bersih Utama -->
        <div class="bg-slate-900 text-white rounded-3xl p-8 mb-8 shadow-2xl">
            <p class="text-xs font-light text-slate-400 uppercase tracking-widest mb-2">Saldo Bersih</p>
            <div id="saldo-bersih" class="text-4xl font-bold tracking-tighter">Rp 0</div>
        </div>

        <!-- Grid Ringkasan -->
        <div class="grid grid-cols-2 gap-4 mb-8">
            <div class="bg-white p-5 rounded-2xl border border-slate-100">
                <p class="text-[10px] text-slate-400 uppercase font-bold mb-1">Pemasukan</p>
                <div id="total-pemasukan" class="text-lg font-bold text-emerald-600">Rp 0</div>
            </div>
            <div class="bg-white p-5 rounded-2xl border border-slate-100">
                <p class="text-[10px] text-slate-400 uppercase font-bold mb-1">Pengeluaran</p>
                <div id="total-pengeluaran" class="text-lg font-bold text-rose-600">Rp 0</div>
            </div>
        </div>

        <!-- Tombol Aksi -->
        <div class="flex gap-4">
            <button onclick="openTransactionModal('pemasukan')" class="flex-1 bg-white border border-slate-200 py-4 rounded-2xl text-xs font-bold active:scale-95 transition">Pemasukan +</button>
            <button onclick="openTransactionModal('pengeluaran')" class="flex-1 bg-slate-900 text-white py-4 rounded-2xl text-xs font-bold active:scale-95 transition">Pengeluaran -</button>
        </div>
    </div>

    <script>
        let transactions = JSON.parse(localStorage.getItem('cb_transactions')) || [];
        
        function updateAllUI() {
            const activePeriod = document.getElementById('month-selector').value;
            const activeMonthTransactions = transactions.filter(tx => tx.period === activePeriod);
            
            let totalPemasukan = 0;
            let totalPengeluaran = 0;
            
            activeMonthTransactions.forEach(tx => {
                if (tx.type === 'pemasukan') totalPemasukan += tx.amount;
                else totalPengeluaran += tx.amount;
            });

            document.getElementById('total-pemasukan').textContent = formatIDR(totalPemasukan);
            document.getElementById('total-pengeluaran').textContent = formatIDR(totalPengeluaran);
            
            const saldoBersih = totalPemasukan - totalPengeluaran;
            const bersihEl = document.getElementById('saldo-bersih');
            bersihEl.textContent = formatIDR(saldoBersih);
        }

        function formatIDR(val) { return 'Rp ' + val.toLocaleString('id-ID'); }
        
        // Inisialisasi awal
        updateAllUI();
    </script>
</body>
</html>
